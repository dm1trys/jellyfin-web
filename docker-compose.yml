services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-backend
    ports:
      - "8920:8920"
    expose:
      - "8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./media:/media
    restart: unless-stopped

  wiktapi:
    build:
      context: .
      dockerfile: Dockerfile.wiktapi
      target: runtime
    container_name: wiktapi
    environment:
      DATA_PATH: /data/wiktionary.db
      PORT: 3000
    volumes:
      - ${WIKTAPI_DATA_DIR:-./wiktapi-data}:/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  wiktapi-worker:
    build:
      context: .
      dockerfile: Dockerfile.wiktapi
      target: worker
    container_name: wiktapi-worker
    volumes:
      - ${WIKTAPI_DATA_DIR:-./wiktapi-data}:/app/packages/api/data
    profiles:
      - tools

  stanza-morph:
    build:
      context: .
      dockerfile: Dockerfile.stanza
    container_name: stanza-morph
    environment:
      STANZA_LANGUAGE: de
      STANZA_MODEL_DIR: /opt/stanza
      STANZA_PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  ard-proxy:
    build:
      context: .
      dockerfile: Dockerfile.ard-proxy
    container_name: ard-proxy
    environment:
      ARD_PROXY_HOST: 0.0.0.0
      ARD_PROXY_PORT: 5100
      ARD_API_BASE_URL: ${ARD_API_BASE_URL:-https://api.ardmediathek.de}
      ARD_USER_ID: ${ARD_USER_ID:-personalized}
      ARD_IMAGE_CACHE_DIR: /cache
      ARD_IMAGE_CACHE_MAX_AGE_SECONDS: ${ARD_IMAGE_CACHE_MAX_AGE_SECONDS:-86400}
      ARD_HOME_CACHE_TTL_SECONDS: ${ARD_HOME_CACHE_TTL_SECONDS:-120}
      ARD_PAGE_CACHE_TTL_SECONDS: ${ARD_PAGE_CACHE_TTL_SECONDS:-120}
      ARD_MAX_HOME_ROWS: ${ARD_MAX_HOME_ROWS:-8}
      ARD_MAX_ROW_ITEMS: ${ARD_MAX_ROW_ITEMS:-12}
    volumes:
      - ${ARD_IMAGE_CACHE_DIR:-./ard-image-cache}:/cache
    ports:
      - "5100:5100"
    restart: unless-stopped

  jellyfin-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jellyfin-web
    depends_on:
      - jellyfin
      - wiktapi
      - stanza-morph
      - ard-proxy
    environment:
      BIND_HOST: 0.0.0.0
      WEB_CLIENT_PORT: 8097
      JELLYFIN_BACKEND_URL: ${JELLYFIN_BACKEND_URL:-http://jellyfin:8096}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      WIKTAPI_BASE_URL: ${WIKTAPI_BASE_URL:-http://wiktapi:3000}
      STANZA_BASE_URL: ${STANZA_BASE_URL:-http://stanza-morph:5000}
      ARD_PROXY_BASE_URL: ${ARD_PROXY_BASE_URL:-http://ard-proxy:5100}
    ports:
      - "8097:8097"
    restart: unless-stopped

  jellyfin-proxy:
    image: nginx:alpine
    container_name: jellyfin-proxy
    depends_on:
      - jellyfin
      - jellyfin-web
    ports:
      - "8096:8096"
    volumes:
      - ./ops/nginx/jellyfin-8096.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  jellyfin_config:
  jellyfin_cache:

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-backend
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./media:/media
    restart: unless-stopped

  wiktapi:
    build:
      context: .
      dockerfile: Dockerfile.wiktapi
      target: runtime
    container_name: wiktapi
    environment:
      DATA_PATH: /data/wiktionary.db
      PORT: 3000
    volumes:
      - ${WIKTAPI_DATA_DIR:-./wiktapi-data}:/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  wiktapi-worker:
    build:
      context: .
      dockerfile: Dockerfile.wiktapi
      target: worker
    container_name: wiktapi-worker
    volumes:
      - ${WIKTAPI_DATA_DIR:-./wiktapi-data}:/app/packages/api/data
    profiles:
      - tools

  stanza-morph:
    build:
      context: .
      dockerfile: Dockerfile.stanza
    container_name: stanza-morph
    environment:
      STANZA_LANGUAGE: de
      STANZA_MODEL_DIR: /opt/stanza
      STANZA_PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  jellyfin-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jellyfin-web
    depends_on:
      - jellyfin
      - wiktapi
      - stanza-morph
    environment:
      BIND_HOST: 0.0.0.0
      WEB_CLIENT_PORT: 8097
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      WIKTAPI_BASE_URL: ${WIKTAPI_BASE_URL:-http://wiktapi:3000}
      STANZA_BASE_URL: ${STANZA_BASE_URL:-http://stanza-morph:5000}
    ports:
      - "8097:8097"
    restart: unless-stopped

volumes:
  jellyfin_config:
  jellyfin_cache:
